<!doctype html>
<html lang="en">
  <head>

        <p style="margin:0 0 8px;font-weight:700">In PowerShell, run:</p>
        <pre style="overflow:auto;padding:14px 16px;background:#fffefa;border-left:4px solid #f5d54c;color:#19263d">cd &lt;project-folder&gt;
npm run dev</pre>
